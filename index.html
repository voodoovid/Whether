<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Whether">
<meta name="theme-color" id="themeColor" content="#0a1226">
<meta name="format-detection" content="telephone=no">
<title>Whether (or not)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --sky1:#050c22; --sky2:#173063;
  --glass:rgba(7,15,32,.34); --glass2:rgba(255,255,255,.07); --edge:rgba(255,255,255,.14); --hair:rgba(255,255,255,.10);
  --text:#fff; --mute:rgba(255,255,255,.96);
  --sun:255,183,49; --cloud:176,192,216; --rain:58,168,255; --hum:62,214,196;
  --lab:76px; --colmin:33px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
html,body{height:100%;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
html{background:var(--sky2);min-height:100vh;min-height:100lvh}
body{background:linear-gradient(172deg,var(--sky1),var(--sky2)) fixed;background-color:var(--sky1);min-height:100vh;min-height:100lvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{width:1em;height:1em;display:block;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.f-sun{fill:rgb(var(--sun))} .f-cloud{fill:#dfe7f3} .f-cloud2{fill:#9fb0c8} .f-rain{fill:rgb(var(--rain))} .f-hum{fill:rgb(var(--hum))} .f-moon{fill:#e8eefb}
.s-sun{stroke:rgb(var(--sun))} .s-rain{stroke:rgb(var(--rain))} .s-cloud{stroke:#dfe7f3}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:22px;-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35)}
#fx{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;pointer-events:none;z-index:0}
#flash{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;pointer-events:none;z-index:45;background:#e4ecff;opacity:0}
#app{position:relative;z-index:1}
.nowbody,.nowmain{display:contents}
.nowside,#strip{display:none}

#app{height:100dvh;display:grid;grid-template-columns:clamp(300px,27vw,372px) minmax(0,1fr);gap:14px;
  padding:calc(env(safe-area-inset-top) + clamp(8px,1.2vh,14px)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#left{display:flex;flex-direction:column;gap:12px;min-height:0}
#right{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.18fr) minmax(0,1fr);gap:12px;min-height:0;min-width:0}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:800;letter-spacing:-.4px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.brand img{width:32px;height:32px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ttl{display:flex;flex-direction:column;align-items:center;line-height:1}
.t2{font-size:.56em;font-weight:700;letter-spacing:.4px;color:#f4b942;margin-top:3px;text-shadow:none}
.loc{display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:700;padding:5px 12px 5px 8px;margin:-4px 0 0 -8px;border-radius:999px;min-width:0;max-width:100%;align-self:flex-start;background:rgba(255,255,255,.12)}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc svg{width:16px;height:16px;flex:none;fill:#fff}
.loc .chev{width:11px;height:11px;fill:none;stroke:var(--mute);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.seg{display:inline-flex;border-radius:999px;padding:3px;background:var(--glass);border:1px solid var(--edge)}
.seg button{padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:rgba(255,255,255,.22);color:#fff}
.rbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--edge)}
.rbtn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.spin svg{animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* now card */
.now{flex:1 1 0;min-height:150px;padding:clamp(12px,2vh,22px) 20px;display:flex;flex-direction:column;justify-content:space-between}
.nowtop{display:flex;align-items:center;gap:14px}
.nowtop .ic{font-size:clamp(70px,11.5vh,120px)}
.bigt{font-size:clamp(80px,14.5vh,150px);font-weight:500;letter-spacing:-5px;line-height:.95;text-shadow:0 2px 14px rgba(0,0,0,.18)}
.cond{font-size:clamp(20px,3vh,28px);font-weight:700;margin-top:6px}
.hilo{font-size:16px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:3px;font-weight:600}
.upd{font-size:12px;color:var(--mute);margin-top:6px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.tile{padding:clamp(10px,1.7vh,18px) 15px;min-height:clamp(88px,12.5vh,128px);justify-content:center;display:flex;flex-direction:column;gap:2px;min-width:0;border-radius:18px}
.tile .k{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
.tile .v{font-size:clamp(28px,4.4vh,44px);font-weight:700;letter-spacing:-.5px;line-height:1.12;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:.48em;font-weight:700;color:var(--mute);margin-left:3px;letter-spacing:0}
.tile .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.16);position:relative;margin:5px 0 2px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgb(var(--hum))}
.meter.uv{background:linear-gradient(90deg,#4ed07a 0%,#f1d437 28%,#ff9a2e 52%,#ff5a4f 76%,#b583ff 100%)}
.meter.uv b{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.45);transform:translateX(-50%)}

/* panels */
.panel{min-width:0;padding:clamp(10px,1.5vh,16px) 16px clamp(8px,1.3vh,14px);display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:baseline;gap:6px 16px;margin-bottom:clamp(4px,.8vh,10px);flex-wrap:wrap;min-height:22px}
.ph h2{font-size:17px;font-weight:800;letter-spacing:.1px}
#readout{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums;align-items:center}
#readout .when{font-weight:800;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:999px}
#readout .ro{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--mute)}
#readout .ro b{color:#fff}
#readout .ro i{width:9px;height:9px;border-radius:3px}

/* hourly */
#hscroll{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#hscroll::-webkit-scrollbar{display:none}
#hgrid{display:flex;flex-direction:column;justify-content:space-between;height:100%;min-width:calc(var(--lab) + 24*var(--colmin))}
.r{display:grid;grid-template-columns:var(--lab) repeat(24,minmax(0,1fr));flex:none;position:relative}
.lab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap;z-index:3;padding-right:4px}
.lab i{width:9px;height:9px;border-radius:3px;flex:none}
.c{display:flex;align-items:center;justify-content:center;min-width:0;cursor:pointer;font-size:12.5px;font-variant-numeric:tabular-nums;position:relative}
.c.night{background:rgba(0,0,10,.20)}
.c.sel{background:rgba(255,255,255,.17)}
.c.mid{box-shadow:inset 1.5px 0 0 rgba(255,255,255,.28)}
.r.time{height:clamp(22px,3.1vh,28px)} .r.time .c{font-size:10.5px;font-weight:700;color:var(--mute);white-space:nowrap;letter-spacing:-.2px}
.r.time .c.hl{color:#fff;font-weight:800}
.r.icon{height:clamp(30px,4.8vh,42px)} .r.icon .ic{font-size:clamp(24px,3.7vh,32px)}
.r.curve{flex:1.5 1 0;min-height:64px;max-height:128px}
.r.curve .c{background:none!important;box-shadow:none!important}
.cv{grid-column:2/-1;grid-row:1;position:relative;pointer-events:none}
.cv svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cv .dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22);transform:translate(-50%,-50%)}
.cv .tl{position:absolute;transform:translate(-50%,-135%);font-size:clamp(13px,1.9vh,16px);font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.r.feel{height:clamp(18px,2.6vh,24px)} .r.feel .c{color:var(--mute);font-size:12px}
.r.heat{flex:1 1 0;min-height:27px;max-height:46px}
.hc{width:calc(100% - 4px);height:calc(100% - 4px);margin:2px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;line-height:1}
.hc.none{background:transparent!important;color:rgba(255,255,255,.85)!important;font-weight:600}
.r.uv{height:clamp(24px,3.4vh,30px)}
.uvc{min-width:23px;height:21px;padding:0 5px;border-radius:7px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:800;color:#0b1220}
.uvc.z{background:none;color:rgba(255,255,255,.85);font-weight:600}
.r.hum{height:clamp(20px,2.8vh,26px)} .r.hum .c{color:rgb(var(--hum));font-weight:800;font-size:12.5px;filter:brightness(1.25)}

/* daily */
.dcols,.drow{display:grid;grid-template-columns:74px minmax(118px,1.2fr) minmax(130px,1.45fr) repeat(3,minmax(0,1fr)) 58px 46px 58px;gap:6px;align-items:center}
.dhead{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);padding:0 4px 4px;border-bottom:1px solid var(--hair)}
.dhead span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.dhead i{width:8px;height:8px;border-radius:3px;display:inline-block}
.dhead .ctr{justify-content:center}
#drows{flex:1;min-height:0;display:grid;grid-template-rows:repeat(10,minmax(0,1fr))}
.drow{padding:0 4px;border-bottom:1px solid var(--hair);min-height:0}
.drow:last-child{border-bottom:0}
.drow.today{background:rgba(255,255,255,.10);border-radius:12px;border-bottom-color:transparent}
.dd{display:flex;flex-direction:column;line-height:1.15}
.dd b{font-size:15px;font-weight:800} .dd span{font-size:11.5px;color:var(--mute)}
.ds{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;min-width:0}
.ds .ic{font-size:clamp(24px,3.5vh,32px)} .ds span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtp{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.dtp .lo{width:28px;text-align:right;color:var(--mute);font-weight:700;font-size:14px}
.dtp .hi{width:28px;font-weight:800;font-size:16px}
.rng{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.16);position:relative}
.rng i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#69c2ff,#ffc04d)}
.dm{display:contents}
.dc{height:clamp(24px,calc(100% - 8px),38px);border-radius:9px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dc u{text-decoration:none;font-weight:700;font-size:11px;opacity:.8}
.dc small{display:none}
.dc.plain{background:none;color:#fff;font-weight:700}
.dc.hu{color:rgb(var(--hum));filter:brightness(1.25)}
.dc.fl{font-weight:700}

/* sheet */
#saved{position:relative}
.grip{width:18px;height:18px;flex:none;fill:#fff;margin-left:4px}
#saved .row{position:relative;transition:transform .16s ease,box-shadow .16s ease,background .16s ease;-webkit-touch-callout:none;touch-action:pan-y}
#saved .row.lift{transition:box-shadow .16s ease,background .16s ease;z-index:5;background:rgba(60,110,190,.55);box-shadow:0 10px 28px rgba(0,0,0,.5);touch-action:none}
#saved .row>span:first-child{flex:1;min-width:0}

#sheet{position:fixed;inset:0;background:rgba(2,6,14,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 56px) 16px 16px}
#sheet[hidden]{display:none}
.shc{width:min(460px,100%);max-height:calc(100dvh - 90px);overflow:auto;background:rgba(14,24,44,.92);border:1px solid var(--edge);border-radius:22px;padding:14px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.sht{display:flex;gap:10px;margin-bottom:10px}
.sht input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:12px;padding:11px 13px;font-size:16px;color:#fff;outline:none}
.sht input::placeholder{color:rgba(255,255,255,.85)}
.sht input:focus{border-color:rgb(var(--rain))}
.sht button{color:rgb(var(--rain));font-weight:800;padding:0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 10px;border-radius:12px;font-size:15px}
.row:active{background:rgba(255,255,255,.1)}
.row small{color:var(--mute);font-size:12px}
.row .x{color:var(--mute);padding:4px 8px;font-size:18px;line-height:1}
.rgps{color:rgb(var(--rain));font-weight:800;border-bottom:1px solid var(--hair);border-radius:12px 12px 0 0;margin-bottom:4px}
.shh{color:var(--mute);font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:10px 10px 4px}
.ver{color:var(--mute);font-size:11.5px;padding:12px 10px 2px;line-height:1.5}
#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:rgba(14,24,44,.95);border:1px solid var(--edge);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60}
#msg[hidden]{display:none}
#err{grid-column:1/-1;display:grid;place-items:center;text-align:center;color:var(--mute);gap:12px}
#err button{background:#fff;color:#08121f;font-weight:800;padding:10px 20px;border-radius:999px}

/* phone / portrait */
@media (min-width:901px) and (max-width:1290px){
  :root{--lab:68px;--colmin:29px}
  #app{grid-template-columns:clamp(250px,23vw,290px) minmax(0,1fr)}
  .hc{font-size:12px;border-radius:8px} .r.time .c{font-size:9.5px;letter-spacing:-.3px}
  .lab{font-size:11px;gap:4px} .lab i{width:8px;height:8px}
  .dcols,.drow{grid-template-columns:62px minmax(96px,1.1fr) minmax(110px,1.3fr) repeat(3,minmax(0,1fr)) 48px 38px 52px;gap:5px}
  .dc{font-size:12.5px;gap:3px} .dc u{font-size:10px}
  .ds span{font-size:12.5px} .dtp .lo,.dtp .hi{width:24px} .dtp{gap:6px}
  .tile .v{font-size:clamp(26px,4vh,34px)} .bigt{letter-spacing:-4px}
}
.vtag{font-size:11px;font-weight:800;letter-spacing:.3px;color:var(--mute);background:rgba(255,255,255,.12);padding:2px 7px;border-radius:999px;align-self:center;margin-left:-2px}
#btn10,.dclose{display:none}
.cond .acc{display:inline-block;vertical-align:.18em;font-size:.62em;font-weight:800;color:#dff0ff;background:rgba(74,168,255,.32);padding:.15em .6em;border-radius:999px;white-space:nowrap;text-shadow:none}
@media (max-width:900px){
  :root{--lab:74px;--colmin:46px}
  html,body{height:100vh;height:100lvh;overflow:hidden}
  #app{height:100vh;height:100lvh;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) max(12px,env(safe-area-inset-right)) max(8px,calc(env(safe-area-inset-bottom) - 16px)) max(12px,env(safe-area-inset-left))}
  #left{display:contents}
  #right{display:contents}
  .bar{order:0} .now{order:1;flex:none} #strip{order:2}
  .tiles,#hourly{display:none}
  .brand{font-size:22px;min-width:0} .brand img{width:30px;height:30px} .tools{gap:6px}

  /* current conditions sit straight on the sky */
  .now.glass{background:none;border:0;border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none}
  .now{padding:0 4px;text-shadow:0 1px 12px rgba(0,0,0,.28)}
  .loc{margin:0;align-self:flex-start;text-shadow:none}
  .nowbody{display:grid;grid-template-columns:auto auto;justify-content:space-between;align-items:start;gap:12px;margin-top:10px}
  .nowmain{display:flex;flex-direction:column;min-width:0;align-self:center}
  .nowtop{gap:6px;margin-left:-4px}
  .nowtop .ic{font-size:min(60px,15vw)}
  .bigt{font-size:min(98px,23.5vw);font-weight:600;letter-spacing:-4px;line-height:.9}
  .cond{font-size:22px;margin-top:10px;line-height:1.2}
  .hilo{font-size:21px;color:#fff;font-weight:800;margin-top:6px;white-space:nowrap}
  .upd{font-size:16px;color:#fff;font-weight:600;margin-top:6px}
  .nowside{display:flex;flex-direction:column;gap:7px;width:min(168px,40vw)}
  .st{padding:7px 12px 8px;border-radius:16px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);
    box-shadow:0 6px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);text-shadow:none}
  .st .k{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#fff;white-space:nowrap}
  .st .v{font-size:26px;font-weight:700;letter-spacing:-.3px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
  .st .v small{font-size:13px;font-weight:700;color:#fff;margin-left:4px;letter-spacing:0}
  .st .w{font-size:13.5px;font-weight:700;color:#d6e6fa;line-height:1.15;margin-top:1px}
  .st.big .v{font-size:46px;font-weight:300;letter-spacing:-2px;line-height:1.02}
  .st.uvt .v{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.02}
  .st.uvt .v small{font-size:16px;color:#fff}

  /* hourly verticals: 4 on screen, swipe for 24 */
  #strip{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;padding:10px 6px 8px}
  #strip .ph{padding:0 8px;justify-content:space-between;align-items:center;margin-bottom:6px}
  #strip .ph h2{font-size:20px}
  .hint{font-size:18px;font-weight:800;color:#fff;transition:opacity .3s}
  .hint.gone{opacity:0}
  #sscroll{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #sscroll::-webkit-scrollbar{display:none}
  #scols{display:grid;grid-auto-flow:column;grid-auto-columns:25%;height:100%}
  .scol{scroll-snap-align:start;margin:0 2px;border-radius:20px;background:rgba(255,255,255,.06);text-align:center;font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;padding:8px 0 10px;overflow:hidden;min-height:0}
  .scol.nt{background:rgba(0,6,22,.16)}
  .scol.cur{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.26)}
  .scol>*{display:flex;align-items:center;justify-content:center;min-width:0;flex:none}
  .scol .tm{font-size:17px;font-weight:700;color:var(--mute);white-space:nowrap}
  .scol .tm.hl{color:#fff;font-weight:800}
  .scol .ic{font-size:54px}
  .scol .tp{font-size:40px;font-weight:700;letter-spacing:-.5px;line-height:1}

function wx(code,day=1){
  const n=!day;
  if(code===0) return {i:n?'moon':'sun',t:n?'Clear':'Sunny'};
  if(code===1) return {i:n?'moon':'sun',t:n?'Mostly clear':'Mostly sunny'};
  if(code===2) return {i:n?'partn':'part',t:'Partly cloudy'};
  if(code===3) return {i:'cloud2',t:'Overcast'};
  if(code===45||code===48) return {i:'fog',t:'Fog'};
  if(code>=51&&code<=57) return {i:'rain',t:code>=56?'Freezing drizzle':'Drizzle'};
  if(code>=61&&code<=67) return {i:'rain',t:code>=66?'Freezing rain':code===65?'Heavy rain':code===61?'Light rain':'Rain'};
  if(code>=71&&code<=77) return {i:'snow',t:'Snow'};
  if(code>=80&&code<=82) return {i:'rain',t:'Showers'};
  if(code===85||code===86) return {i:'snow',t:'Snow showers'};

}
function uvInfo(v){
  const r=Math.round(v);

function applySky(C){
  const day=!!C.is_day, code=C.weather_code, cc=C.cloud_cover??0;

function fxCfg(C){
  const code=C.weather_code??0;
  const RAIN={51:.15,53:.25,55:.35,56:.25,57:.35,61:.35,63:.6,65:.9,66:.45,67:.8,80:.4,81:.65,82:.95,95:.8,96:.9,99:.95};

  for(const sec of ['current','hourly','daily']){
    const o=j[sec]; if(!o) continue; const out={};
    const bases=new Set(Object.keys(o).map(k=>{for(const m of MODELS) if(k.endsWith('_'+m)) return k.slice(0,-m.length-1); return k}));
    for(const b of bases){
      const vs=[...MODELS.map(m=>o[b+'_'+m]),o[b]].filter(v=>v!==undefined);
      if(!vs.length) continue;
      if(Array.isArray(vs[0])) out[b]=vs[0].map((_,i)=>{for(const v of vs){if(Array.isArray(v)&&v[i]!=null) return v[i]} return null});
      else out[b]=vs.find(v=>v!=null)??null;
    }
    j[sec]=out;
  }
  return j;
}

async function load(manual){
  const {lat,lon}=S.loc;
  $('#refresh').classList.add('spin');
  const base=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=auto&forecast_days=10&past_days=1&current=${CURRENT}&hourly=${HOURLY}&daily=${DAILY}`;
  try{
    const get=async u=>{const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),15000);
      const r=await fetch(u,{signal:ctl.signal}); clearTimeout(to); if(!r.ok) throw new Error('http '+r.status); return r.json()};
    let j;
    try{ j=mergeModels(await get(base+'&models='+MODELS.join(','))) }
    catch(_){ j=await get(base) }
    if(!j.hourly||!j.daily||!j.current) throw new Error('bad data');
    trimPast(j);
    j._at=Date.now();
    S.data=j; S.offline=false; S.sel=0; MEM[key(S.loc)]=j;
    LS.set('cache',{k:key(S.loc),j});
    render();
  }catch(e){
    const c=LS.get('cache',null);
    if(c&&c.k===key(S.loc)){S.data=c.j;S.offline=true;S.sel=0;render();toast(manual?'Offline — showing last saved forecast':'');}
    else showError();
  }
  $('#refresh').classList.remove('spin');
}
function showError(){
  if(!S.data){ $('#right').style.display='none'; $('.now').style.display='none'; $('#tiles').style.display='none'; $('#strip').style.visibility='hidden';
    let e=$('#err'); if(!e){e=document.createElement('div');e.id='err';e.innerHTML='<div><div style="font-size:20px;color:#fff;font-weight:800;margin-bottom:6px">Can’t reach the forecast</div>Check your connection and try again.</div><button id="retry">Retry</button>';$('#app').appendChild(e);e.querySelector('#retry').onclick=()=>{load(true)}}
  }
}
function toast(t,ms=3500){const m=$('#msg');if(!t){m.hidden=true;return}m.textContent=t;m.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>m.hidden=true,ms)}

/* ---------- render ---------- */
function rainPass(j){
  const fix=(o,pk,probK,thr)=>{ if(!o||!o.weather_code||!o[probK]) return;
    o.weather_code=o.weather_code.map((c,i)=>{ if(PCODE(c)) return c;
      const pr=o[probK][i]??0, mm=o[pk]?.[i]??0;
      if(mm>=2.5) return 63; if(mm>=0.1||pr>=Math.max(thr,50)) return 61; if(pr>=thr) return 80; return c}) };
  fix(j.hourly,'precipitation','precipitation_probability',40);
  fix(j.daily,'precipitation_sum','precipitation_probability_max',60);
}

    tile('UV index',`${Math.round(uvBig)}<small>${ui.l}</small>`,uvSub,`<div class="meter uv"><b style="left:${clamp(uvBig/11*100,2,98)}%"></b></div>`)+

  // rain/snow so far today, shown beside the condition when it's coming down

const tile=(k,v,s,extra='')=>`<div class="tile glass"><div class="k">${k}</div><div class="v">${v}</div>${extra}<div class="s">${s}</div></div>`;

/* past_days=1 is requested so ground conditions can look back overnight; daily arrays then start yesterday — drop it */
function trimPast(j){
  const today=(j.current&&j.current.time||'').slice(0,10), D=j.daily; if(!D||!D.time) return;
  const di=D.time.indexOf(today); if(di>0) for(const k in D) if(Array.isArray(D[k])) D[k]=D[k].slice(di);
}
const WET=c=>(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;
const SNOWY=c=>(c>=71&&c<=77)||c===85||c===86;
/* how much is coming down, in plain words (mm per hour) */
function rainWord(mm){
  if(!(mm>0)) return {t:'Zip',c:'#fff'};
  if(mm<0.3) return {t:'A smidge',c:'#c4e3ff'};
  if(mm<1)   return {t:'A bit',c:'#9fd2ff'};
  if(mm<2.5) return {t:'Steady',c:'#7cc4ff'};
  if(mm<5)   return {t:'Lots',c:'#b3a8ff'};
  if(mm<10)  return {t:'Shit ton',c:'#da9bff'};
  return {t:'Yikes!',c:'#ff6b8a'};
}
/* wind in words (km/h; gusts nudge it up) */
function windWord(ws,gust){
  const e=Math.max(ws||0,(gust||0)*.65);
  if(e<2)  return 'Dead calm';
  if(e<12) return 'Gentle breeze';
  if(e<20) return 'Breezy';
  if(e<29) return 'Flags flapping';
  if(e<39) return 'Hat may fly off';
  if(e<50) return 'Umbrella wrecker';
  if(e<62) return 'Hold on tight';
  if(e<75) return 'Trees bending';
  return 'Stay inside!';
}
const fW=k=>k==null?'–':Math.round(met()?k:k*0.621371);
const wUnit=()=>met()?'km/h':'mph';
/* what the ground is like right now, from recent rain/snow, snow cover and temperature */
function ground(j,C,idx){
  const H=j.hourly, T=C.temperature_2m??5, code=C.weather_code;
  const back=(arr,n)=>{let t=0;if(!arr)return 0;for(let i=Math.max(0,idx-n);i<=idx;i++)t+=arr[i]??0;return t};
  const r3=back(H.precipitation,3)+(C.precipitation||0), r12=back(H.precipitation,12), sn12=back(H.snowfall,12);
  const depth=H.snow_depth?.[idx]??0, wetNow=WET(code)||(C.precipitation||0)>0, snowNow=SNOWY(code);
  if(depth>=0.02||(snowNow&&T<=1)||(sn12>=1&&T<=1)){
    if(T>1&&(wetNow||r3>0.3)) return {t:'Slushy',c:'#cfdbe8'};
    return {t:'Snowy',c:'#ffffff'};
  }
  if(T<=0&&(wetNow||r12>=0.2)) return {t:'Icy',c:'#9ee8ff'};
  if(sn12>=0.3) return {t:'Slushy',c:'#cfdbe8'};
  if(wetNow||r3>=0.5) return r3>=4?{t:'Puddles',c:'#7cc0ff'}:{t:'Wet',c:'#9fd2ff'};
  if(r3>0.05||r12>=0.5) return {t:'Damp',c:'#c3dcf2'};
  if(T<=1&&!C.is_day&&(C.cloud_cover??100)<40&&(C.relative_humidity_2m??0)>=85) return {t:'Frosty',c:'#d9f3ff'};
  return {t:'Dry',c:'#f2dfae'};
}
const DROP='<svg viewBox="0 0 12 12"><path d="M6 1C6 1 2 5.6 2 8a4 4 0 0 0 8 0C10 5.6 6 1 6 1z"/></svg>';

function renderStrip(j,C){
  const H=j.hourly, a=S.idx, N=24;
  const pr=i=>{const v=H.precipitation_probability[a+i];return v==null?0:clamp(v,0,100)};
  const Y=v=>(32-v/100*28).toFixed(2);  // chart is 34 tall; 0% sits on the floor
  let out='';
  for(let i=0;i<N;i++){
    const k=a+i, t=H.time[k], night=!H.is_day[k], c0=i===0;
    const tm=c0?'<div class="tm hl">Now</div>':`<div class="tm">${hourLabel(t)}</div>`;

    const code=c0?C.weather_code:H.weather_code[k], isDay=c0?C.is_day:H.is_day[k];
    const p=H.precipitation_probability[k], mm=H.precipitation[k]??0, pv=pr(i);
    const l=(pr(Math.max(0,i-1))+pv)/2, r=(pv+pr(Math.min(N-1,i+1)))/2;
    const line=`M0 ${Y(l)} L50 ${Y(pv)} L100 ${Y(r)}`;
    const chart=`<div class="ch"><svg viewBox="0 0 100 34" preserveAspectRatio="none">
        <defs><linearGradient id="rgr${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4db0ff" stop-opacity=".95"/><stop offset="1" stop-color="#2a7fe0" stop-opacity=".35"/></linearGradient></defs>
        <line x1="0" x2="100" y1="4" y2="4" stroke="rgba(255,255,255,.28)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>
        <line x1="0" x2="100" y1="18" y2="18" stroke="rgba(255,255,255,.36)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>
        <path d="${line} L100 34 L0 34 Z" fill="url(#rgr${i})"/>
        <path d="${line}" fill="none" stroke="#e6f5ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <line x1="0" x2="100" y1="32" y2="32" stroke="rgba(255,255,255,.55)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      </svg><b style="top:${(+Y(pv)/34*100).toFixed(1)}%"></b></div>`;
    const rw=rainWord(mm);
    const uv=Math.max(0,H.uv_index[k]??0), ui=uvInfo(uv);
    const ws=c0?(C.wind_speed_10m??H.wind_speed_10m?.[k]):H.wind_speed_10m?.[k];
    const gu=c0?(C.wind_gusts_10m??H.wind_gusts_10m?.[k]):H.wind_gusts_10m?.[k];

    const arrow=wdir==null?'':`<svg viewBox="0 0 14 14" style="transform:rotate(${(wdir+180)%360}deg)"><path d="M7 12V2M3 6l4-4 4 4"/></svg>`;
    out+=`<div class="scol${c0?' cur':''}${night?' nt':''}">${tm}
      <div>${ico(wx(code,isDay).i)}</div>
      <div class="tp">${fT(temp)}</div>
      <div class="fl">Feels<b>${fT(feel)}</b></div>
      <div class="rc"><span class="p${pv>0?'':' z'}">${DROP}${p==null?'–':p+'%'}</span>${chart}
        <span class="mm${mm>0?'':' z'}">${met()?(mm>0?(mm<10?mm.toFixed(1):Math.round(mm)):'0'):(mm/25.4).toFixed(2)}<small>${met()?'mm':'in'}</small></span>
        <span class="aw" style="color:${rw.c}">${rw.t}</span></div>
      <div class="uv">UV<b style="color:${ui.c}">${Math.round(uv)}</b></div>
      <div class="wd"><span class="ws">${arrow}${fW(ws)}<small>${wUnit()}</small></span><span class="ww">${ws==null?'':windWord(ws,gu)}</span></div>
    </div>`;
  }
  $('#scols').innerHTML=out;
}
$('#sscroll').addEventListener('scroll',()=>$('#hint').classList.toggle('gone',$('#sscroll').scrollLeft>8),{passive:true});

function renderHourly(j){
  const H=j.hourly, a=S.idx, N=24;
  const cells=(fn)=>{let s='';for(let i=0;i<N;i++){const k=a+i,t=H.time[k];const night=!H.is_day[k];const mid=i>0&&t.slice(11,13)==='00';
    s+=`<div class="c${night?' night':''}${mid?' mid':''}${i===S.sel?' sel':''}" data-i="${i}">${fn(k,i,t,night)}</div>`}return s};
  const row=(cls,label,dot,inner,extra='')=>`<div class="r ${cls}"><div class="lab">${dot?`<i style="background:${dot}"></i>`:''}${label}</div>${inner}${extra}</div>`;

  const path=ys.map((y,i)=>`${i?'L':'M'}${(i+.5).toFixed(2)} ${y.toFixed(2)}`).join(' ');
  const area=`${path} L${(N-.5)} 100 L0.5 100 Z`;
  const overlay=`<div class="cv"><svg viewBox="0 0 ${N} 100" preserveAspectRatio="none">
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#ag)"/><path d="${path}" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`
    +ys.map((y,i)=>`<span class="dot" style="left:${((i+.5)/N*100).toFixed(3)}%;top:${y.toFixed(2)}%"></span><span class="tl" style="left:${((i+.5)/N*100).toFixed(3)}%;top:${y.toFixed(2)}%">${fT(H.temperature_2m[a+i])}</span>`).join('')+`</div>`;
  rows.push(row('curve','Temp','',cells(()=>''),overlay));

  rows.push(row('heat','Cloud %',`rgb(${RGB.cloud})`,cells(k=>heat('cloud',H.cloud_cover[k]??0,Math.round(H.cloud_cover[k]??0)))));

  $('#hgrid').innerHTML=rows.join('');

function renderDaily(j){
  const H=j.hourly,D=j.daily,n=D.time.length;
  const lo=Math.min(...D.temperature_2m_min),hi=Math.max(...D.temperature_2m_max),span=Math.max(hi-lo,1);

  for(let d=0;d<n;d++){

    const dayIx=ix.filter(i=>H.is_day[i]);
    const cloud=mean((dayIx.length?dayIx:ix).map(i=>H.cloud_cover[i]));
    const hum=mean(ix.map(i=>H.relative_humidity_2m[i]));
    const sunH=(D.sunshine_duration[d]??0)/3600, dayH=Math.max((D.daylight_duration[d]??1)/3600,.1);

    const mmTxt=D.precipitation_sum[d]>0?fP(D.precipitation_sum[d]):'';
    out+=`<div class="drow${d===0?' today':''}">
      <div class="dd"><b>${d===0?'Today':dayName(date)}</b><span>${dayDate(date)}</span></div>
      <div class="ds">${ico(w.i)}<span>${w.t}</span></div>
      <div class="dtp"><span class="lo">${fT(D.temperature_2m_min[d])}</span><div class="rng"><i style="left:${l}%;width:${wd}%"></i></div><span class="hi">${fT(D.temperature_2m_max[d])}</span></div>
      <div class="dm">
        ${heat('sun',sunPct,`<small>Sun</small>${sunTxt}`,'dc')}
        ${heat('cloud',cloud,`<small>Cloud</small>${cloud==null?'–':Math.round(cloud)+'%'}`,'dc')}
        ${heat('rain',pp,`<small>Rain</small>${pp==null?'–':pp+'%'}${mmTxt?`<u>${mmTxt}</u>`:''}`,'dc rn')}
        <div class="dc plain fl"><small>Feels</small>${fT(D.apparent_temperature_max[d])}</div>
        <div class="dc plain"><small>UV</small>${uvChip(D.uv_index_max[d])}</div>
        <div class="dc plain hu"><small>Humid.</small>${hum==null?'–':Math.round(hum)+'%'}</div>
      </div>
    </div>`;
  }
  $('#drows').innerHTML=out;
}

/* ---------- location ---------- */
async function revName(lat,lon){
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    const j=await r.json();
    const clean=s=>s&&!/regional district|regional municipality|county$/i.test(s)?s:'';
    const loc=clean(j.locality), city=clean(j.city);
    let n=(loc&&city&&loc!==city)?`${loc}, ${city}`:(loc||city);
    if(!n){const st=j.principalSubdivision;n=st?abbr(st):'My location'}
    return n;
  }catch(e){return 'My location'}
}
async function search(q){
  q=q.trim(); if(!q) return [];
  const compact=q.toUpperCase().replace(/\s+/g,'');
  const ca=compact.match(/^([A-Z]\d[A-Z])(\d[A-Z]\d)?$/), us=q.match(/^\d{5}(-\d{4})?$/);
  if(ca||us){
    try{
      const r=await fetch(ca?`https://api.zippopotam.us/ca/${ca[1]}`:`https://api.zippopotam.us/us/${q.slice(0,5)}`);
      if(r.ok){const j=await r.json();return j.places.slice(0,4).map(p=>({name:`${p['place name']}, ${p['state abbreviation']}`,lat:+p.latitude,lon:+p.longitude,sub:j['post code']}))}
    }catch(e){}
  }
  const parts=q.split(','), name=parts[0].trim(), region=(parts[1]||'').trim().toLowerCase();
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=10&language=en&format=json`);
  const j=await r.json(); let res=j.results||[];
  if(region){const m=res.filter(x=>(x.admin1&&(abbr(x.admin1).toLowerCase()===region||x.admin1.toLowerCase().startsWith(region)))||(x.country_code||'').toLowerCase()===region||(x.country||'').toLowerCase().startsWith(region));if(m.length)res=m}
  return res.slice(0,6).map(x=>{const dom=x.country_code==='CA'||x.country_code==='US';return {name:`${x.name}, ${x.admin1?abbr(x.admin1):x.country}`,lat:x.latitude,lon:x.longitude,sub:dom?'':(x.country||'')}});
}
function setLoc(l){
  S.loc={name:l.name,lat:l.lat,lon:l.lon}; LS.set('loc',S.loc);
  if(!S.saved.some(s=>key(s)===key(l))){S.saved.unshift(S.loc);S.saved=S.saved.slice(0,8);LS.set('saved',S.saved)}
  closeSheet(); S.data=null; $('#locName').textContent=l.name; load(true);
}
function openSheet(){ $('#sheet').hidden=false; $('#q').value=''; $('#results').innerHTML=''; drawSaved(); setTimeout(()=>$('#q').focus(),50) }
function closeSheet(){ $('#sheet').hidden=true; $('#q').blur() }
function drawSaved(){
  $('#savedH').style.display=S.saved.length?'':'none';
  $('#saved').innerHTML=S.saved.map((s,i)=>`<div class="row" data-s="${i}"><span>${esc(s.name)}</span><svg class="grip" viewBox="0 0 18 18" aria-hidden="true"><circle cx="6" cy="4" r="1.6"/><circle cx="12" cy="4" r="1.6"/><circle cx="6" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="6" cy="14" r="1.6"/><circle cx="12" cy="14" r="1.6"/></svg><button class="x" data-x="${i}" aria-label="Remove">×</button></div>`).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let qT;
$('#q').addEventListener('input',()=>{clearTimeout(qT);const v=$('#q').value;if(v.trim().length<2){$('#results').innerHTML='';return}
  qT=setTimeout(async()=>{try{const r=await search(v);window._res=r;$('#results').innerHTML=r.length?r.map((x,i)=>`<button class="row" data-r="${i}"><span>${esc(x.name)}</span><small>${esc(x.sub||'')}</small></button>`).join(''):'<div class="ver">No matches</div>'}catch(e){$('#results').innerHTML='<div class="ver">Search unavailable offline</div>'}},300)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=document.querySelector('#results [data-r]');if(f)f.click()}});
$('#results').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b)setLoc(window._res[+b.dataset.r])});
$('#saved').addEventListener('click',e=>{
  const x=e.target.closest('[data-x]'); if(x){S.saved.splice(+x.dataset.x,1);LS.set('saved',S.saved);drawSaved();return}
  const r=e.target.closest('[data-s]'); if(r){setLoc(S.saved[+r.dataset.s])}
});
$('#gps').addEventListener('click',()=>{
  if(!navigator.geolocation){toast('Location isn’t available on this device');return}
  $('#gps span').textContent='Finding you…';
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=+p.coords.latitude.toFixed(3),lon=+p.coords.longitude.toFixed(3);
    const name=await revName(lat,lon);
    $('#gps span').textContent='Use my current location';
    setLoc({name,lat,lon});
  },()=>{$('#gps span').textContent='Use my current location';toast('Couldn’t get your location — check permissions')},{timeout:12000,maximumAge:300000});
});

/* ---- saved places: hold a row and drag it up or down to reorder ---- */
(function(){
  const box=$('#saved'); let D=null, justDragged=false;
  const clear=()=>{ if(D){clearTimeout(D.t)} D=null };
  box.addEventListener('pointerdown',e=>{
    const row=e.target.closest('[data-s]'); if(!row||e.target.closest('[data-x]')||(e.pointerType==='mouse'&&e.button!==0)) return;
    D={row,id:e.pointerId,y0:e.clientY,y:e.clientY,on:false,from:+row.dataset.s,to:+row.dataset.s};
    D.t=setTimeout(()=>{ if(!D) return; D.on=true; D.rows=[...box.children]; D.h=D.rows[0].getBoundingClientRect().height||44;
      row.classList.add('lift'); try{row.setPointerCapture(D.id)}catch(_){}; if(navigator.vibrate) navigator.vibrate(12); },380);
  });
  box.addEventListener('pointermove',e=>{
    if(!D) return;
    if(!D.on){ if(Math.abs(e.clientY-D.y0)>8||Math.abs(e.clientX-(D.x0??(D.x0=e.clientX)))>12) clear(); return }
    D.y=e.clientY; const dy=D.y-D.y0, n=D.rows.length;
    D.row.style.transform=`translateY(${dy}px)`;
    const to=Math.max(0,Math.min(n-1,D.from+Math.round(dy/D.h))); D.to=to;
    D.rows.forEach((r,i)=>{ if(r===D.row) return;
      let t=0; if(D.from<to&&i>D.from&&i<=to) t=-D.h; else if(to<D.from&&i>=to&&i<D.from) t=D.h;
      r.style.transform=t?`translateY(${t}px)`:'' });
    e.preventDefault();
  });
  const end=()=>{
    if(!D) return; const d=D; clear();
    if(!d.on) return;
    justDragged=true; setTimeout(()=>justDragged=false,350);
    if(d.to!==d.from){ const [m]=S.saved.splice(d.from,1); S.saved.splice(d.to,0,m); LS.set('saved',S.saved) }
    drawSaved();
  };
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);
  box.addEventListener('touchmove',e=>{ if(D&&D.on) e.preventDefault() },{passive:false});
  box.addEventListener('contextmenu',e=>e.preventDefault());
  box.addEventListener('click',e=>{ if(justDragged){e.stopImmediatePropagation();e.preventDefault()} },true);
})();

/* ---- swipe up / down on the main screen to cycle through saved places ---- */
(function(){
  const app=$('#app'), phone=matchMedia('(max-width:900px)'); let g=null;
  app.addEventListener('touchstart',e=>{
    if(!phone.matches||e.touches.length!==1||document.body.classList.contains('d10')||e.target.closest('#daily,button,input,a')){g=null;return}
    const t=e.touches[0]; g={x:t.clientX,y:t.clientY,t:Date.now()};
  },{passive:true});
  app.addEventListener('touchend',e=>{
    if(!g) return; const t=e.changedTouches[0], dx=t.clientX-g.x, dy=t.clientY-g.y, dt=Date.now()-g.t; g=null;
    if(Math.abs(dy)<70||Math.abs(dy)<Math.abs(dx)*1.6||dt>900) return;
    cycleLoc(dy<0?1:-1);
  },{passive:true});
  app.addEventListener('touchcancel',()=>{g=null},{passive:true});
})();
const MEM={};                     // in-memory forecast per place, for instant swipes
let cycling=false;
function cycleLoc(dir){
  const L=S.saved; if(!L||L.length<2){toast(L&&L.length?'Only one saved place — add more with the location button':'Save places with the location button');return}
  if(cycling) return;
  let i=L.findIndex(s=>key(s)===key(S.loc)); if(i<0) i=dir>0?-1:0;
  const n=(i+dir+L.length)%L.length, l=L[n];
  S.loc={name:l.name,lat:l.lat,lon:l.lon}; LS.set('loc',S.loc);
  toast(`${l.name}  ·  ${n+1} of ${L.length}`,1400);
  const els=[...document.querySelectorAll('#app .now,#app #strip')], D=dir>0?1:-1;
  if(!els.length||!els[0].animate||matchMedia('(prefers-reduced-motion: reduce)').matches){ $('#locName').textContent=l.name; S.data=null; load(true); return }
  cycling=true;
  const outs=els.map(el=>el.animate([{transform:'none',opacity:1},{transform:`translateY(${-D*60}px)`,opacity:0}],{duration:190,easing:'cubic-bezier(.4,0,.8,.6)',fill:'forwards'}));
  Promise.all(outs.map(a=>a.finished.catch(()=>{}))).then(()=>{
    els.forEach(el=>el.style.opacity='0'); outs.forEach(a=>a.cancel());
    S.slideIn=D; $('#locName').textContent=l.name;
    const m=MEM[key(l)];
    if(m){ S.data=m; S.offline=false; S.sel=0; render(); load() } else { S.data=null; load(true) }
    setTimeout(()=>{ els.forEach(el=>el.style.opacity=''); S.slideIn=0; cycling=false },9000);
  });
}
function slideIn(){
  const D=S.slideIn; if(!D) return; S.slideIn=0;
  const els=[...document.querySelectorAll('#app .now,#app #strip')];
  els.forEach(el=>{ el.style.opacity=''; el.animate([{transform:`translateY(${D*70}px)`,opacity:0},{transform:'none',opacity:1}],{duration:400,easing:'cubic-bezier(.2,.85,.25,1)'}) });
  setTimeout(()=>{cycling=false},420);
}
$('#vtag').textContent='v'+VER;
$('#btn10').onclick=()=>document.body.classList.add('d10');
$('#d10close').onclick=()=>document.body.classList.remove('d10');
$('#locBtn').onclick=openSheet; $('#shClose').onclick=closeSheet;
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#uC').onclick=()=>{S.units='metric';LS.set('units','metric');render()};
$('#uF').onclick=()=>{S.units='imperial';LS.set('units','imperial');render()};
$('#refresh').onclick=()=>load(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!S.data||Date.now()-S.data._at>10*60e3))load()});
setInterval(()=>{if(!document.hidden&&S.data&&Date.now()-S.data._at>15*60e3)load()},60e3);

/* ---------- boot ---------- */
(function(){
  const c=LS.get('cache',null);
  if(c&&c.k===key(S.loc)){S.data=c.j;S.offline=true;render()}   // instant paint, then refresh
  load();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
